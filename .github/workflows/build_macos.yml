name: Build macOS DMG

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    steps:
      - name: Kodni yuklab olish
        uses: actions/checkout@v4

      - name: Python 3.11 o'rnatish
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Kutubxonalarni o'rnatish
        run: |
          pip install requests pyinstaller

      - name: .app paketini yig'ish
        run: |
          pyinstaller --noconfirm --windowed --name "Amox SmartBell" smartbell.py

      - name: .dmg disk tasvirini yaratish
        run: |
          mkdir -p dmg_folder
          cp -R "dist/Amox SmartBell.app" dmg_folder/
          ln -s /Applications dmg_folder/Applications
          hdiutil create -volname "Amox SmartBell" -srcfolder dmg_folder -ov -format UDZO AmoxSmartBell.dmg

      - name: Tayyor DMG faylni saqlash
        uses: actions/upload-artifact@v4
        with:
          name: AmoxSmartBell-macOS
          path: AmoxSmartBell.dmg
